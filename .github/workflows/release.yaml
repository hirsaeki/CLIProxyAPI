name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  GH_REPO: ${{ github.repository }}
  GO_VERSION: '1.26.4'
  LLVM_MINGW_VERSION: '20260616'
  LLVM_MINGW_SHA256: 'b9b68a4d276e16fa25802aaba458e4638f64b3884c290aaccdc2d87083b6ca35'

jobs:
  prepare-release:
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          release_title="${GITHUB_REF_NAME} (Local Model Overlay build)"
          release_notes_file="$(mktemp)"
          generated_notes_file="$(mktemp)"
          changelog_entries_file="$(mktemp)"
          changelog_notes_file="$(mktemp)"
          updated_notes_file="$(mktemp)"
          trap 'rm -f "$release_notes_file" "$generated_notes_file" "$changelog_entries_file" "$changelog_notes_file" "$updated_notes_file"' EXIT

          cat > "$release_notes_file" <<'EOF'
          <!-- cliproxyapi-linux-release-assets:start -->
          ## Linux release assets

          - `CLIProxyAPI_<version>_linux_<arch>.tar.gz` is the default Linux build. It supports dynamic library plugins and is built against a GLIBC 2.17 baseline.
          - `CLIProxyAPI_<version>_linux_<arch>_no-plugin.tar.gz` is the portable Linux build for musl-based or older systems such as OpenWrt. It does not support dynamic library plugins.

          The optional OAuth model availability helper is distributed separately as `oauth-model-availability-helper_<version>_<os>_<arch>.<format>`. It is intentionally excluded from the main CLIProxyAPI archives and WinGet package.

          ## FreeBSD release assets

          - `CLIProxyAPI_<version>_freebsd_aarch64_no-plugin.tar.gz` is the FreeBSD arm64 build. It is built without CGO and does not support dynamic library plugins.

          ## Windows release assets

          - `CLIProxyAPI_<version>_windows_<arch>.zip` contains the server and documentation only.
          - [Vertex region models plugin for Windows x64](https://github.com/__REPOSITORY__/releases/download/__TAG__/vertex-region-models___VERSION___windows_amd64.zip)
          - [Vertex region models plugin for Windows ARM64](https://github.com/__REPOSITORY__/releases/download/__TAG__/vertex-region-models___VERSION___windows_aarch64.zip)

          Each plugin ZIP contains `plugins/windows/<arch>/vertex-region-models-v<version>.dll`. Extract the matching ZIP into `~/.cli-proxy-api`, set `plugins.dir` to `~/.cli-proxy-api/plugins`, and explicitly enable `vertex-region-models`.

          <!-- cliproxyapi-linux-release-assets:end -->
          EOF
          release_version="${GITHUB_REF_NAME#v}"
          sed -i \
            -e "s|__REPOSITORY__|${GH_REPO}|g" \
            -e "s|__TAG__|${GITHUB_REF_NAME}|g" \
            -e "s|__VERSION__|${release_version}|g" \
            "$release_notes_file"

          git fetch --force --tags
          previous_tag=""
          if previous_tag_value="$(git describe --tags --match 'v[0-9]*' --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null)"; then
            previous_tag="$previous_tag_value"
            changelog_range="${previous_tag}..${GITHUB_REF_NAME}"
          else
            changelog_range="$GITHUB_REF_NAME"
          fi

          git log --reverse --pretty=format:'- %s (%h)' "$changelog_range" |
            grep -Ev '^- (docs:|test:)' > "$changelog_entries_file" || true

          gh api "repos/${GH_REPO}/releases/generate-notes" \
            -f tag_name="$GITHUB_REF_NAME" \
            --jq .body > "$generated_notes_file"
          if [[ ! -s "$generated_notes_file" ]]; then
            if [[ -n "$previous_tag" ]]; then
              printf '**Full Changelog**: https://github.com/%s/compare/%s...%s\n' "$GH_REPO" "$previous_tag" "$GITHUB_REF_NAME" > "$generated_notes_file"
            else
              printf '**Full Changelog**: https://github.com/%s/commits/%s\n' "$GH_REPO" "$GITHUB_REF_NAME" > "$generated_notes_file"
            fi
          fi

          {
            if [[ -s "$changelog_entries_file" ]]; then
              printf '## Changelog\n\n'
              cat "$changelog_entries_file"
              printf '\n\n'
            fi
            cat "$generated_notes_file"
          } > "$changelog_notes_file"

          {
            cat "$release_notes_file"
            printf '\n'
            cat "$changelog_notes_file"
          } > "$updated_notes_file"

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "$release_title" --notes-file "$updated_notes_file"
          else
            gh release create "$GITHUB_REF_NAME" --title "$release_title" --notes-file "$updated_notes_file"
          fi

  build-hosted:
    name: build ${{ matrix.target }}
    needs: prepare-release
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-amd64
            runner: macos-15-intel
            goos: darwin
            goarch: amd64
            asset_arch: amd64
            archive_format: tar.gz
          - target: darwin-arm64
            runner: macos-15
            goos: darwin
            goarch: arm64
            asset_arch: aarch64
            archive_format: tar.gz
          - target: windows-amd64
            runner: windows-latest
            goos: windows
            goarch: amd64
            asset_arch: amd64
            archive_format: zip
          - target: windows-arm64
            runner: windows-11-arm
            goos: windows
            goarch: arm64
            asset_arch: aarch64
            archive_format: zip
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Refresh models catalog
        shell: bash
        run: bash .github/scripts/refresh-model-catalogs.sh
      - name: Fetch tags
        shell: bash
        run: git fetch --force --tags
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-
            go-${{ runner.os }}-${{ runner.arch }}-
      - name: Generate Build Metadata
        shell: bash
        run: |
          set -euo pipefail
          echo "RELEASE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          echo "COMMIT=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          echo "BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - name: Build archive
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          ASSET_ARCH: ${{ matrix.asset_arch }}
          ARCHIVE_FORMAT: ${{ matrix.archive_format }}
        run: |
          set -euo pipefail
          binary_name="cli-proxy-api"
          helper_name="sync-oauth-model-availability"
          if [[ "$GOOS" == "windows" ]]; then
            binary_name="cli-proxy-api.exe"
            helper_name="sync-oauth-model-availability.exe"
          fi

          archive_dir="dist/${TARGET}/archive"
          archive_name="CLIProxyAPI_${RELEASE_VERSION}_${GOOS}_${ASSET_ARCH}.${ARCHIVE_FORMAT}"
          helper_archive_dir="dist/${TARGET}/oauth-model-availability-helper"
          helper_archive_name="oauth-model-availability-helper_${RELEASE_VERSION}_${GOOS}_${ASSET_ARCH}.${ARCHIVE_FORMAT}"
          rm -rf "dist/${TARGET}"
          mkdir -p "$archive_dir" "$helper_archive_dir"

          CGO_ENABLED=1 GOOS="$GOOS" GOARCH="$GOARCH" go build \
            -ldflags="-s -w -X main.Version=${RELEASE_VERSION} -X main.Commit=${COMMIT} -X main.BuildDate=${BUILD_DATE}" \
            -o "$archive_dir/$binary_name" ./cmd/server/
          CGO_ENABLED=0 GOOS="$GOOS" GOARCH="$GOARCH" go build -buildvcs=false \
            -ldflags="-s -w" \
            -o "$helper_archive_dir/$helper_name" ./cmd/sync_oauth_model_availability/

          cp LICENSE README.md README_CN.md config.example.yaml "$archive_dir/"
          if [[ "$ARCHIVE_FORMAT" == "zip" ]]; then
            powershell -NoProfile -Command "Compress-Archive -Path '${archive_dir}/*' -DestinationPath 'dist/${archive_name}' -Force"
            cp LICENSE docs/oauth-model-availability.md "$helper_archive_dir/"
            powershell -NoProfile -Command "Compress-Archive -Path '${helper_archive_dir}/*' -DestinationPath 'dist/${helper_archive_name}' -Force"
          else
            tar -C "$archive_dir" -czf "dist/$archive_name" "$binary_name" LICENSE README.md README_CN.md config.example.yaml
            cp LICENSE docs/oauth-model-availability.md "$helper_archive_dir/"
            tar -C "$helper_archive_dir" -czf "dist/$helper_archive_name" "$helper_name" LICENSE oauth-model-availability.md
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            dist/CLIProxyAPI_*
            dist/oauth-model-availability-helper_*
          if-no-files-found: error
      - name: Upload release assets
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(dist/CLIProxyAPI_*.tar.gz dist/CLIProxyAPI_*.zip dist/oauth-model-availability-helper_*.tar.gz dist/oauth-model-availability-helper_*.zip)
          if [[ ${#assets[@]} -eq 0 ]]; then
            printf 'expected archive assets, found %s\n' "${#assets[@]}" >&2
            printf '%s\n' "${assets[@]}" >&2
            exit 1
          fi
          gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
      - name: Refresh release checksums
        continue-on-error: true
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "$tmp_dir"' EXIT
          gh release download "$GITHUB_REF_NAME" \
            --pattern 'CLIProxyAPI_*.tar.gz' \
            --pattern 'CLIProxyAPI_*.zip' \
            --pattern 'oauth-model-availability-helper_*.tar.gz' \
            --pattern 'oauth-model-availability-helper_*.zip' \
            --pattern 'vertex-region-models_*.zip' \
            --dir "$tmp_dir" \
            --clobber
          (
            cd "$tmp_dir"
            shopt -s nullglob
            archives=(CLIProxyAPI_*.tar.gz CLIProxyAPI_*.zip oauth-model-availability-helper_*.tar.gz oauth-model-availability-helper_*.zip vertex-region-models_*.zip)
            if [[ ${#archives[@]} -eq 0 ]]; then
              echo "No release archives found"
              exit 0
            fi
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "${archives[@]}" | sort -k2 > checksums.txt
            else
              shasum -a 256 "${archives[@]}" | sort -k2 > checksums.txt
            fi
          )
          gh release upload "$GITHUB_REF_NAME" "$tmp_dir/checksums.txt" --clobber

  build-windows-plugin:
    name: build Windows plugin ${{ matrix.goarch }}
    needs: prepare-release
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: amd64
            asset_arch: amd64
            cc: x86_64-w64-mingw32-clang
          - goarch: arm64
            asset_arch: aarch64
            cc: aarch64-w64-mingw32-clang
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Install LLVM-MinGW
        shell: pwsh
        run: >-
          & .github/scripts/install-llvm-mingw.ps1
          -Version $env:LLVM_MINGW_VERSION
          -Sha256 $env:LLVM_MINGW_SHA256
          -Compiler '${{ matrix.cc }}'
      - name: Generate Build Metadata
        shell: bash
        run: |
          set -euo pipefail
          echo "RELEASE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Build Vertex region models plugin
        shell: bash
        env:
          GOARCH: ${{ matrix.goarch }}
          ASSET_ARCH: ${{ matrix.asset_arch }}
          CC: ${{ matrix.cc }}
        run: |
          set -euo pipefail
          plugin_package_dir="dist/vertex-region-models"
          plugin_dir="$plugin_package_dir/plugins/windows/$GOARCH"
          plugin_archive_name="vertex-region-models_${RELEASE_VERSION}_windows_${ASSET_ARCH}.zip"
          plugin_output="${PWD}/${plugin_dir}/vertex-region-models-v${RELEASE_VERSION}.dll"
          plugin_link_output="${PWD}/${plugin_dir}/vertex_region_models.dll"
          mkdir -p "$plugin_dir"
          pushd examples/plugin/vertex-region-models/go >/dev/null
          CGO_ENABLED=1 GOOS=windows GOARCH="$GOARCH" go build \
            -buildmode=c-shared \
            -o "$plugin_link_output" .
          popd >/dev/null
          rm -f "${plugin_link_output%.dll}.h"
          mv "$plugin_link_output" "$plugin_output"
          test -f "$plugin_output"
          test ! -f "${plugin_link_output%.dll}.h"
          powershell -NoProfile -Command "Compress-Archive -Path '${plugin_package_dir}/*' -DestinationPath 'dist/${plugin_archive_name}' -Force"
          test -f "dist/$plugin_archive_name"
      - name: Test Windows Vertex plugin runtime
        if: ${{ matrix.goarch == 'amd64' }}
        shell: bash
        run: |
          set -euo pipefail
          plugin_path="${PWD}/dist/vertex-region-models/plugins/windows/amd64/vertex-region-models-v${RELEASE_VERSION}.dll"
          plugin_path="$(cygpath -w "$plugin_path")"
          CLIPROXY_VERTEX_REGION_MODELS_PLUGIN="$plugin_path" \
            go test ./internal/pluginhost \
              -run '^(TestDynamicLibraryClientSerializesCalls|TestVertexRegionModelsPluginCABI)$' \
              -count=1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-plugin-${{ matrix.goarch }}
          path: dist/vertex-region-models_*.zip
          if-no-files-found: error
      - name: Upload release asset
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          assets=(dist/vertex-region-models_*.zip)
          if [[ ${#assets[@]} -ne 1 ]]; then
            printf 'expected one plugin archive, found %s\n' "${#assets[@]}" >&2
            exit 1
          fi
          gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber

  build-linux-glibc:
    name: build linux-${{ matrix.goarch }} glibc
    needs: prepare-release
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            runner: ubuntu-latest
            goarch: amd64
            asset_arch: amd64
            manylinux_image: quay.io/pypa/manylinux2014_x86_64
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            goarch: arm64
            asset_arch: aarch64
            manylinux_image: quay.io/pypa/manylinux2014_aarch64
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Refresh models catalog
        shell: bash
        run: bash .github/scripts/refresh-model-catalogs.sh
      - name: Fetch tags
        shell: bash
        run: git fetch --force --tags
      - name: Generate Build Metadata
        shell: bash
        run: |
          set -euo pipefail
          echo "RELEASE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          echo "COMMIT=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          echo "BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - name: Build archive
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          GOARCH: ${{ matrix.goarch }}
          ASSET_ARCH: ${{ matrix.asset_arch }}
          MANYLINUX_IMAGE: ${{ matrix.manylinux_image }}
        run: |
          set -euo pipefail

          archive_dir="dist/${TARGET}/archive"
          archive_name="CLIProxyAPI_${RELEASE_VERSION}_linux_${ASSET_ARCH}.tar.gz"
          rm -rf "dist/${TARGET}"
          mkdir -p "$archive_dir"

          docker run --rm \
            -v "$PWD:/src" \
            -w /src \
            -e GO_VERSION \
            -e GOARCH \
            -e RELEASE_VERSION \
            -e COMMIT \
            -e BUILD_DATE \
            "$MANYLINUX_IMAGE" \
            bash -euo pipefail -c '
              go_archive="go${GO_VERSION}.linux-${GOARCH}.tar.gz"
              curl -fsSL "https://go.dev/dl/${go_archive}" -o "/tmp/${go_archive}"
              rm -rf /usr/local/go
              tar -C /usr/local -xzf "/tmp/${go_archive}"
              export PATH="/usr/local/go/bin:${PATH}"

              CGO_ENABLED=1 GOOS=linux GOARCH="${GOARCH}" go build -buildvcs=false \
                -ldflags="-s -w -X main.Version=${RELEASE_VERSION} -X main.Commit=${COMMIT} -X main.BuildDate=${BUILD_DATE}" \
                -o "'"$archive_dir"'/cli-proxy-api" ./cmd/server/
              glibc_versions="$(readelf --version-info "'"$archive_dir"'/cli-proxy-api" | sed -n "s/.*Name: GLIBC_\([0-9.]*\).*/\1/p" | sort -Vu)"
              if [[ -n "${glibc_versions}" ]]; then
                printf "GLIBC versions:\n%s\n" "${glibc_versions}"
                max_glibc="$(printf "%s\n" "${glibc_versions}" | sort -V | tail -n 1)"
                if [[ "$(printf "2.17\n%s\n" "${max_glibc}" | sort -V | tail -n 1)" != "2.17" ]]; then
                  printf "linux ${GOARCH} binary requires GLIBC_%s, expected GLIBC_2.17 or older\n" "${max_glibc}" >&2
                  exit 1
                fi
              fi
            '

          cp LICENSE README.md README_CN.md config.example.yaml "$archive_dir/"
          tar -C "$archive_dir" -czf "dist/$archive_name" cli-proxy-api LICENSE README.md README_CN.md config.example.yaml
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/CLIProxyAPI_*
          if-no-files-found: error
      - name: Upload release assets
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(dist/CLIProxyAPI_*.tar.gz)
          if [[ ${#assets[@]} -eq 0 ]]; then
            printf 'expected archive assets, found %s\n' "${#assets[@]}" >&2
            printf '%s\n' "${assets[@]}" >&2
            exit 1
          fi
          gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
      - name: Refresh release checksums
        continue-on-error: true
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "$tmp_dir"' EXIT
          gh release download "$GITHUB_REF_NAME" \
            --pattern 'CLIProxyAPI_*.tar.gz' \
            --pattern 'CLIProxyAPI_*.zip' \
            --dir "$tmp_dir" \
            --clobber
          (
            cd "$tmp_dir"
            shopt -s nullglob
            archives=(CLIProxyAPI_*.tar.gz CLIProxyAPI_*.zip)
            if [[ ${#archives[@]} -eq 0 ]]; then
              echo "No release archives found"
              exit 0
            fi
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "${archives[@]}" | sort -k2 > checksums.txt
            else
              shasum -a 256 "${archives[@]}" | sort -k2 > checksums.txt
            fi
          )
          gh release upload "$GITHUB_REF_NAME" "$tmp_dir/checksums.txt" --clobber

  build-linux-no-plugin:
    name: build linux-${{ matrix.goarch }} no-plugin
    needs: prepare-release
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64-no-plugin
            goarch: amd64
            asset_arch: amd64
          - target: linux-arm64-no-plugin
            goarch: arm64
            asset_arch: aarch64
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Refresh models catalog
        shell: bash
        run: bash .github/scripts/refresh-model-catalogs.sh
      - name: Fetch tags
        shell: bash
        run: git fetch --force --tags
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-linux-no-plugin-${{ matrix.goarch }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-linux-no-plugin-${{ matrix.goarch }}-
            go-linux-no-plugin-
      - name: Generate Build Metadata
        shell: bash
        run: |
          set -euo pipefail
          echo "RELEASE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          echo "COMMIT=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          echo "BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - name: Build archive
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          GOARCH: ${{ matrix.goarch }}
          ASSET_ARCH: ${{ matrix.asset_arch }}
        run: |
          set -euo pipefail

          archive_dir="dist/${TARGET}/archive"
          archive_name="CLIProxyAPI_${RELEASE_VERSION}_linux_${ASSET_ARCH}_no-plugin.tar.gz"
          helper_archive_dir="dist/${TARGET}/oauth-model-availability-helper"
          helper_archive_name="oauth-model-availability-helper_${RELEASE_VERSION}_linux_${ASSET_ARCH}.tar.gz"
          rm -rf "dist/${TARGET}"
          mkdir -p "$archive_dir" "$helper_archive_dir"

          CGO_ENABLED=0 GOOS=linux GOARCH="$GOARCH" go build -buildvcs=false \
            -ldflags="-s -w -X main.Version=${RELEASE_VERSION} -X main.Commit=${COMMIT} -X main.BuildDate=${BUILD_DATE}" \
            -o "$archive_dir/cli-proxy-api" ./cmd/server/
          CGO_ENABLED=0 GOOS=linux GOARCH="$GOARCH" go build -buildvcs=false \
            -ldflags="-s -w" \
            -o "$helper_archive_dir/sync-oauth-model-availability" ./cmd/sync_oauth_model_availability/

          if readelf -l "$archive_dir/cli-proxy-api" | grep -q 'Requesting program interpreter'; then
            readelf -l "$archive_dir/cli-proxy-api" >&2
            echo "no-plugin linux binary must not require a dynamic interpreter" >&2
            exit 1
          fi

          cp LICENSE README.md README_CN.md config.example.yaml "$archive_dir/"
          tar -C "$archive_dir" -czf "dist/$archive_name" cli-proxy-api LICENSE README.md README_CN.md config.example.yaml
          cp LICENSE docs/oauth-model-availability.md "$helper_archive_dir/"
          tar -C "$helper_archive_dir" -czf "dist/$helper_archive_name" sync-oauth-model-availability LICENSE oauth-model-availability.md
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            dist/CLIProxyAPI_*
            dist/oauth-model-availability-helper_*
          if-no-files-found: error
      - name: Upload release assets
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(dist/CLIProxyAPI_*.tar.gz dist/oauth-model-availability-helper_*.tar.gz)
          if [[ ${#assets[@]} -eq 0 ]]; then
            printf 'expected archive assets, found %s\n' "${#assets[@]}" >&2
            printf '%s\n' "${assets[@]}" >&2
            exit 1
          fi
          gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
      - name: Refresh release checksums
        continue-on-error: true
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "$tmp_dir"' EXIT
          gh release download "$GITHUB_REF_NAME" \
            --pattern 'CLIProxyAPI_*.tar.gz' \
            --pattern 'CLIProxyAPI_*.zip' \
            --pattern 'oauth-model-availability-helper_*.tar.gz' \
            --pattern 'oauth-model-availability-helper_*.zip' \
            --dir "$tmp_dir" \
            --clobber
          (
            cd "$tmp_dir"
            shopt -s nullglob
            archives=(CLIProxyAPI_*.tar.gz CLIProxyAPI_*.zip oauth-model-availability-helper_*.tar.gz oauth-model-availability-helper_*.zip)
            if [[ ${#archives[@]} -eq 0 ]]; then
              echo "No release archives found"
              exit 0
            fi
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "${archives[@]}" | sort -k2 > checksums.txt
            else
              shasum -a 256 "${archives[@]}" | sort -k2 > checksums.txt
            fi
          )
          gh release upload "$GITHUB_REF_NAME" "$tmp_dir/checksums.txt" --clobber

  build-freebsd:
    name: build ${{ matrix.target }}
    needs: prepare-release
    runs-on: ubuntu-latest
    env:
      TARGET: ${{ matrix.target }}
      TARGET_GOARCH: ${{ matrix.goarch }}
      ASSET_ARCH: ${{ matrix.asset_arch }}
      ASSET_SUFFIX: ${{ matrix.asset_suffix }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: freebsd-amd64
            goarch: amd64
            asset_arch: amd64
            asset_suffix: ''
            cgo_enabled: true
          - target: freebsd-arm64-no-plugin
            goarch: arm64
            asset_arch: aarch64
            asset_suffix: _no-plugin
            cgo_enabled: false
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Refresh models catalog
        run: bash .github/scripts/refresh-model-catalogs.sh
      - name: Fetch tags
        run: git fetch --force --tags
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-freebsd-${{ matrix.goarch }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-freebsd-${{ matrix.goarch }}-
            go-freebsd-
      - name: Generate Build Metadata
        id: metadata
        run: |
          set -euo pipefail
          release_version="${GITHUB_REF_NAME#v}"
          commit="$(git rev-parse --short HEAD)"
          build_date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "RELEASE_VERSION=$release_version" >> "$GITHUB_ENV"
          echo "COMMIT=$commit" >> "$GITHUB_ENV"
          echo "BUILD_DATE=$build_date" >> "$GITHUB_ENV"
          echo "release_version=$release_version" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "build_date=$build_date" >> "$GITHUB_OUTPUT"
      - name: Prepare FreeBSD output
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "dist/${TARGET}"
      - name: Install FreeBSD cross-build dependencies
        if: ${{ matrix.cgo_enabled }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y clang lld wget
      - name: Build FreeBSD binary with CGO
        if: ${{ matrix.cgo_enabled }}
        timeout-minutes: 45
        uses: go-cross/cgo-actions@v1
        with:
          dir: .
          packages: ./cmd/server/
          targets: ${{ env.TARGET }}
          out-dir: dist/${{ env.TARGET }}/bin
          output: cli-proxy-api
          flags: >-
            -ldflags=-s -w
            -X main.Version=${{ steps.metadata.outputs.release_version }}
            -X main.Commit=${{ steps.metadata.outputs.commit }}
            -X main.BuildDate=${{ steps.metadata.outputs.build_date }}
      - name: Build FreeBSD no-plugin binary
        if: ${{ !matrix.cgo_enabled }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "dist/${TARGET}/bin"
          CGO_ENABLED=0 GOOS=freebsd GOARCH="$TARGET_GOARCH" go build -buildvcs=false \
            -ldflags="-s -w -X main.Version=${RELEASE_VERSION} -X main.Commit=${COMMIT} -X main.BuildDate=${BUILD_DATE}" \
            -o "dist/${TARGET}/bin/cli-proxy-api" ./cmd/server/
      - name: Package FreeBSD archive
        shell: bash
        run: |
          set -euo pipefail

          archive_dir="dist/${TARGET}/archive"
          archive_name="CLIProxyAPI_${RELEASE_VERSION}_freebsd_${ASSET_ARCH}${ASSET_SUFFIX}.tar.gz"
          helper_archive_dir="dist/${TARGET}/oauth-model-availability-helper"
          helper_archive_name="oauth-model-availability-helper_${RELEASE_VERSION}_freebsd_${ASSET_ARCH}.tar.gz"
          mkdir -p "$archive_dir" "$helper_archive_dir"

          echo "Packaging ${archive_name}"
          cp "dist/${TARGET}/bin/cli-proxy-api" "$archive_dir/cli-proxy-api"
          CGO_ENABLED=0 GOOS=freebsd GOARCH="$TARGET_GOARCH" go build -buildvcs=false \
            -ldflags="-s -w" \
            -o "$helper_archive_dir/sync-oauth-model-availability" ./cmd/sync_oauth_model_availability/
          cp LICENSE README.md README_CN.md config.example.yaml "$archive_dir/"
          tar -C "$archive_dir" -czf "dist/$archive_name" cli-proxy-api LICENSE README.md README_CN.md config.example.yaml
          cp LICENSE docs/oauth-model-availability.md "$helper_archive_dir/"
          tar -C "$helper_archive_dir" -czf "dist/$helper_archive_name" sync-oauth-model-availability LICENSE oauth-model-availability.md
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            dist/CLIProxyAPI_*
            dist/oauth-model-availability-helper_*
          if-no-files-found: error
      - name: Upload release assets
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(dist/CLIProxyAPI_*.tar.gz dist/oauth-model-availability-helper_*.tar.gz)
          if [[ ${#assets[@]} -eq 0 ]]; then
            printf 'expected archive assets, found %s\n' "${#assets[@]}" >&2
            printf '%s\n' "${assets[@]}" >&2
            exit 1
          fi
          gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
      - name: Refresh release checksums
        continue-on-error: true
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "$tmp_dir"' EXIT
          gh release download "$GITHUB_REF_NAME" \
            --pattern 'CLIProxyAPI_*.tar.gz' \
            --pattern 'CLIProxyAPI_*.zip' \
            --pattern 'oauth-model-availability-helper_*.tar.gz' \
            --pattern 'oauth-model-availability-helper_*.zip' \
            --dir "$tmp_dir" \
            --clobber
          (
            cd "$tmp_dir"
            shopt -s nullglob
            archives=(CLIProxyAPI_*.tar.gz CLIProxyAPI_*.zip oauth-model-availability-helper_*.tar.gz oauth-model-availability-helper_*.zip)
            if [[ ${#archives[@]} -eq 0 ]]; then
              echo "No release archives found"
              exit 0
            fi
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "${archives[@]}" | sort -k2 > checksums.txt
            else
              shasum -a 256 "${archives[@]}" | sort -k2 > checksums.txt
            fi
          )
          gh release upload "$GITHUB_REF_NAME" "$tmp_dir/checksums.txt" --clobber

  publish-checksums:
    runs-on: ubuntu-latest
    if: ${{ always() && startsWith(github.ref, 'refs/tags/v') }}
    needs:
      - build-hosted
      - build-windows-plugin
      - build-linux-glibc
      - build-linux-no-plugin
      - build-freebsd
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish final checksums
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd dist
          shopt -s nullglob
          archives=(CLIProxyAPI_*.tar.gz CLIProxyAPI_*.zip oauth-model-availability-helper_*.tar.gz oauth-model-availability-helper_*.zip vertex-region-models_*.zip)
          if [[ ${#archives[@]} -eq 0 ]]; then
            echo "No release archives found"
            exit 0
          fi
          sha256sum "${archives[@]}" | sort -k2 > checksums.txt
          gh release upload "$GITHUB_REF_NAME" checksums.txt --clobber

  update-winget-manifest:
    name: update WinGet manifest
    runs-on: windows-latest
    needs: publish-checksums
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Verify WinGet automation token
        shell: bash
        env:
          WINGET_AUTOMATION_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN }}
        run: |
          if [ -z "$WINGET_AUTOMATION_TOKEN" ]; then
            echo "UPSTREAM_SYNC_TOKEN is required for WinGet pull request automation." >&2
            exit 1
          fi
      - name: Checkout default branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Download Windows release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh release download "$GITHUB_REF_NAME" \
            --pattern "CLIProxyAPI_*_windows_amd64.zip" \
            --pattern "CLIProxyAPI_*_windows_aarch64.zip" \
            --dir dist \
            --clobber
          asset_count="$(find dist -maxdepth 1 -type f -name 'CLIProxyAPI_*_windows_*.zip' | wc -l)"
          if [[ "$asset_count" -ne 2 ]]; then
            echo "expected two Windows release assets, found $asset_count" >&2
            exit 1
          fi
          (cd dist && sha256sum CLIProxyAPI_*_windows_*.zip | sort -k2 > checksums.txt)
      - name: Generate WinGet manifest
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/generate-winget-manifest.sh \
            "$GITHUB_REF_NAME" \
            "$GITHUB_REPOSITORY" \
            dist/checksums.txt \
            winget
      - name: Validate WinGet manifest
        shell: pwsh
        run: |
          if (-not (Get-Command winget -ErrorAction SilentlyContinue)) {
            throw "winget is not available on the Windows runner"
          }
          winget settings --enable LocalManifestFiles
          if ($LASTEXITCODE -ne 0) {
            throw "failed to enable WinGet local manifest validation with exit code $LASTEXITCODE"
          }
          winget validate --manifest winget
          if ($LASTEXITCODE -ne 0) {
            throw "winget manifest validation failed with exit code $LASTEXITCODE"
          }
      - name: Create WinGet manifest pull request
        id: create-winget-pr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.UPSTREAM_SYNC_TOKEN }}
          base: ${{ github.event.repository.default_branch }}
          branch: automation/winget-${{ github.ref_name }}
          delete-branch: true
          commit-message: "chore(winget): update manifest for ${{ github.ref_name }}"
          title: "chore(winget): update manifest for ${{ github.ref_name }}"
          body: |
            Updates the repository-local WinGet manifest for `${{ github.ref_name }}`.

            - Release: https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}
            - Architectures: x64, arm64
            - Validation: `winget validate --manifest winget`
          add-paths: |
            winget/*.yaml
      - name: Merge WinGet manifest after checks pass
        if: steps.create-winget-pr.outputs.pull-request-number != ''
        timeout-minutes: 120
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.create-winget-pr.outputs.pull-request-number }}
        run: |
          set -euo pipefail

          expected_checks=(
            "build"
            "build Windows plugin (amd64)"
            "build Windows plugin (arm64)"
            "ensure-no-translator-changes"
          )
          head_sha="$(gh pr view "$PR_NUMBER" --json headRefOid --jq '.headRefOid')"
          registration_deadline=$((SECONDS + 300))
          while true; do
            checks="$(gh pr checks "$PR_NUMBER" --json name --jq '.[].name' || true)"
            all_registered=true
            for expected_check in "${expected_checks[@]}"; do
              if ! grep -Fxq "$expected_check" <<<"$checks"; then
                all_registered=false
                break
              fi
            done
            if [[ "$all_registered" = true ]]; then
              break
            fi

            action_required_count="$(
              gh api "repos/${GITHUB_REPOSITORY}/commits/${head_sha}/check-suites" \
                --jq '[.check_suites[] | select(.conclusion == "action_required")] | length'
            )"
            if [[ "$action_required_count" -gt 0 ]]; then
              echo "PR checks require manual approval; verify the automation token and Actions approval policy." >&2
              exit 1
            fi
            if (( SECONDS >= registration_deadline )); then
              echo "Timed out waiting for required PR checks to register." >&2
              exit 1
            fi
            sleep 5
          done

          gh pr checks "$PR_NUMBER" --watch --fail-fast
          gh pr merge --merge --delete-branch "$PR_NUMBER"
