name: pr-test-build

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-test-build-${{ github.repository }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  LLVM_MINGW_VERSION: '20260616'
  LLVM_MINGW_SHA256: 'b9b68a4d276e16fa25802aaba458e4638f64b3884c290aaccdc2d87083b6ca35'

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      manifest_only: ${{ steps.scope.outputs.manifest_only }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test fork workflow policy
        run: bash scripts/tests/fork-workflow-policy_test.sh
      - name: Test fork Issue sync authorization
        run: python3 scripts/tests/fork-sync-issue_test.py
      - name: Test manifest-only change detection
        run: bash scripts/tests/fork-pr-manifest-only_test.sh
      - name: Test manifest-only workflow wiring
        run: bash scripts/tests/fork-pr-workflow_test.sh
      - name: Classify actual pull request changes
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          manifest_only="$(bash .github/scripts/fork-pr-manifest-only.sh "$BASE_SHA" "$HEAD_SHA")"
          echo "manifest_only=$manifest_only" >> "$GITHUB_OUTPUT"

  build:
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require successful change classification
        if: needs.changes.result != 'success' || (needs.changes.outputs.manifest_only != 'true' && needs.changes.outputs.manifest_only != 'false')
        run: exit 1
      - name: Manifest-only build check
        if: needs.changes.outputs.manifest_only == 'true'
        run: echo 'No source changes; the Windows amd64 check validates the WinGet manifest.'
      - name: Checkout
        if: needs.changes.outputs.manifest_only != 'true'
        uses: actions/checkout@v4
      - name: Set up Go
        if: needs.changes.outputs.manifest_only != 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Validate Windows plugin workflows
        if: needs.changes.outputs.manifest_only != 'true'
        run: bash scripts/tests/windows-plugin-workflow_test.sh
      - name: Validate OAuth model availability release packaging
        if: needs.changes.outputs.manifest_only != 'true'
        run: bash scripts/tests/oauth-model-availability-release_test.sh
      - name: Test fork model registration and config snapshot races
        if: needs.changes.outputs.manifest_only != 'true'
        run: |
          gofmt -d sdk/cliproxy/persisted_auth_ordering_fork_test.go \
            sdk/cliproxy/auth/types.go sdk/cliproxy/auth/conductor_lifecycle.go \
            sdk/cliproxy/auth/source_file_snapshot_fork.go sdk/cliproxy/auth/source_file_snapshot_fork_test.go \
            sdk/cliproxy/service_auth.go internal/watcher/synthesizer/file.go \
            internal/watcher/synthesizer/source_file_snapshot_fork_test.go \
            sdk/cliproxy/model_registration_config_snapshot_fork_test.go \
            sdk/cliproxy/model_registration_publication_fork_test.go \
            sdk/cliproxy/service_excluded_models_priority_test.go \
            sdk/cliproxy/compat_plugin_exclusions_fork_test.go \
            internal/discovery/zeroconf.go internal/discovery/host_probe_datagram_fork_test.go \
            internal/runtime/executor/claude_executor_stream.go \
            internal/runtime/executor/claude_sse_limit_fork_test.go \
            internal/runtime/executor/helps/claude_sse_limit_fork.go \
            internal/runtime/executor/helps/claude_sse_limit_fork_test.go \
            sdk/api/handlers/claude/code_handlers.go \
            sdk/api/handlers/claude/stream_buffer_bounds_fork.go \
            sdk/api/handlers/claude/stream_buffer_bounds_fork_test.go \
            internal/testutil/forkcatalog/codex_catalog_fork.go \
            internal/testutil/forkcatalog/codex_catalog_fork_test.go \
            internal/api/server_apply_patch_config_test.go internal/api/server_multi_agent_config_test.go \
            internal/api/server_test.go internal/client/codex/models/apply_patch_test.go \
            internal/client/codex/models/models_test.go internal/registry/model_definitions_test.go \
            sdk/api/handlers/openai/codex_client_models_test.go \
            sdk/cliproxy/model_registration_extensions.go sdk/cliproxy/service_executors.go \
            sdk/cliproxy/service_models.go internal/watcher/config_reload.go \
            internal/watcher/config_reload_hash_fork_test.go \
            internal/runtime/executor/thinking_level_fixture_fork_test.go \
            internal/runtime/executor/aistudio_executor_test.go \
            internal/runtime/executor/antigravity_executor_interactions_test.go \
            internal/runtime/executor/websocket_session_target_test.go \
            sdk/api/handlers/openai/openai_responses_websocket_forward.go \
            sdk/api/handlers/openai/openai_responses_interrupt_test.go \
            sdk/api/handlers/openai/openai_responses_interrupt_lifecycle_fork_test.go > "$RUNNER_TEMP/fork-gofmt.diff" || { cat "$RUNNER_TEMP/fork-gofmt.diff"; exit 1; }
          cat "$RUNNER_TEMP/fork-gofmt.diff"
          test ! -s "$RUNNER_TEMP/fork-gofmt.diff"
          go test ./internal/util -run '^Test(NoInPlaceSJSONWrites|InPlaceByteWritesAreReviewed)$' -count=1
          go test -race ./sdk/cliproxy ./internal/watcher ./internal/pluginhost \
            -run 'Fork$|OAuth.*Availability|AvailabilityFallback|TestForkConfigCommit|Native.*Candidates|CandidateModels|ModelProvider|PluginDiscovery|AntigravityCachedRegistration|Issue6583|Issue6559' \
            -count=1 -timeout=5m
          go test -race ./sdk/cliproxy \
            -run '^Test(ModelRegistration|PluginRegistration|CodexExcludedModelsCredentialPriorityAfterPatchAndReload$)' -count=20 -timeout=5m
          go test -race ./internal/runtime/executor/helps ./sdk/api/handlers/claude \
            -run 'TestClaudeSSE.*Fork|TestClaudeStream.*Overflow.*Fork' -count=20 -timeout=5m
          go test -race ./internal/runtime/executor \
            -run '^TestClaudeExecutorSSEEventLimitFork$' -count=1 -timeout=5m
          go test -race ./internal/testutil/forkcatalog -count=20 -timeout=5m
          go test -race ./internal/discovery ./sdk/cliproxy \
            -run '^(TestHostProbeReceivesLargeConflictDatagramFork|TestCompatStaticPluginExclusionsFork)$' -count=20 -timeout=5m
          gofmt -d internal/config/config.go internal/config/config_load.go \
            internal/api/handlers/management/config_source_rewrite_fork_test.go > "$RUNNER_TEMP/config-source-gofmt.diff"
          cat "$RUNNER_TEMP/config-source-gofmt.diff"
          test ! -s "$RUNNER_TEMP/config-source-gofmt.diff"
          go test -race ./internal/watcher ./internal/api ./internal/api/handlers/management \
            ./sdk/cliproxy ./sdk/cliproxy/auth \
            -run 'Issue6631|Issue6643|ConfigLoaderRewrite.*Fork$|ConfigV8ETag' -count=20 -timeout=5m
          go test -race ./internal/pluginhost \
            -run '^Test(Shadow|RemoveStaleShadow|UnixPlugin)' -count=1 -timeout=5m
          go test -race ./internal/runtime/executor ./internal/thinking \
            ./internal/translator/claude/openai/responses \
            -run 'ConfigurationUpdate|HasThinkingSuffix|PinsRequestPerStream' -count=1 -timeout=5m
          go test -race ./sdk/pluginabi -count=1 -timeout=5m
          go test -race ./sdk/cliproxy ./sdk/cliproxy/auth ./internal/watcher ./internal/watcher/synthesizer \
            -run 'FileSnapshot|PersistedAuthSurvivesPreHookWatcherSnapshotFork$' -count=20 -timeout=5m
          go test -race ./sdk/cliproxy \
            -run '^TestPutOpenAICompatConcurrentWithAuthFieldsPatch_Issue6559$' -count=10 -timeout=5m
          go test -race ./internal/runtime/executor \
            -run '^(TestAIStudioTranslateRequestNormalizesThinkingLevel|TestAntigravityExecutorExecuteStreamTranslatesInteractionsRequest|TestWebsocketRetryBindFailureClearsActiveSessionState)$' \
            -count=20 -timeout=5m
          go test -race ./sdk/api/handlers/openai \
            -run '^(TestResponsesTerminalFrameEndsLocalInterruptBeforeStreamCloseFork|TestResponsesLateInterruptDoesNotPoisonNextCreate|TestResponsesInterruptDiagnosticsAreSanitized|TestResponsesInterruptStopsHTTPUpstream)$' \
            -count=20 -timeout=5m
      - name: Test unsatisfiable schema regressions
        if: needs.changes.outputs.manifest_only != 'true'
        run: |
          gofmt -d internal/util/gemini_schema.go \
            internal/util/gemini_schema_false_fork.go internal/util/gemini_schema_false_fork_test.go \
            internal/runtime/executor/antigravity_executor_request.go \
            internal/runtime/executor/antigravity_executor_tokens.go \
            internal/runtime/executor/antigravity_schema_false_fork_test.go \
            internal/runtime/executor/helps/antigravity_schema_false_fork.go \
            internal/runtime/executor/helps/antigravity_schema_false_fork_test.go > "$RUNNER_TEMP/schema-gofmt.diff"
          cat "$RUNNER_TEMP/schema-gofmt.diff"
          test ! -s "$RUNNER_TEMP/schema-gofmt.diff"
          go test -race ./internal/util ./internal/runtime/executor ./internal/runtime/executor/helps \
            -run 'FalseSchema.*Fork$|AllFalseSchema.*Fork$|ToolSearchAllFalse.*Fork$' -count=20 -timeout=5m
      - name: Test Go packages
        if: needs.changes.outputs.manifest_only != 'true'
        run: go test ./... -timeout=5m
      - name: Build
        if: needs.changes.outputs.manifest_only != 'true'
        run: |
          go build -o test-output ./cmd/server
          go build -o sync-oauth-model-availability ./cmd/sync_oauth_model_availability
          rm -f test-output
          rm -f sync-oauth-model-availability
      - name: Verify exact pull request tree
        if: needs.changes.outputs.manifest_only != 'true'
        run: |
          git rev-parse HEAD HEAD^{tree}
          git diff --exit-code
      - name: Refresh models catalog
        if: needs.changes.outputs.manifest_only != 'true'
        run: bash .github/scripts/refresh-model-catalogs.sh
      - name: Test refreshed model catalog
        if: needs.changes.outputs.manifest_only != 'true'
        run: |
          go test ./... -timeout=5m
          go build -o test-output ./cmd/server
          rm -f test-output

  windows-plugin:
    name: build Windows plugin (${{ matrix.goarch }})
    needs: changes
    if: ${{ !cancelled() }}
    # Preserve check names used by historical release workflows without rebuilding
    # plugins for manifest-only updates. Only x64 needs Windows to run winget.
    runs-on: ${{ needs.changes.outputs.manifest_only == 'true' && matrix.goarch == 'arm64' && 'ubuntu-latest' || matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            goarch: amd64
            cc: x86_64-w64-mingw32-clang
          - runner: windows-latest
            goarch: arm64
            cc: aarch64-w64-mingw32-clang
    steps:
      - name: Require successful change classification
        if: needs.changes.result != 'success' || (needs.changes.outputs.manifest_only != 'true' && needs.changes.outputs.manifest_only != 'false')
        shell: bash
        run: exit 1
      - name: Manifest-only arm64 check
        if: needs.changes.outputs.manifest_only == 'true' && matrix.goarch == 'arm64'
        run: echo 'No source changes; WinGet validation in the x64 job covers both manifest architectures.'
      - name: Checkout
        if: needs.changes.outputs.manifest_only != 'true' || matrix.goarch == 'amd64'
        uses: actions/checkout@v4
      - name: Validate WinGet manifest
        if: needs.changes.outputs.manifest_only == 'true' && matrix.goarch == 'amd64'
        timeout-minutes: 5
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Get-Command winget -ErrorAction SilentlyContinue)) {
            throw 'winget is not available on the Windows runner'
          }
          winget settings --enable LocalManifestFiles
          if ($LASTEXITCODE -ne 0) { throw 'failed to enable WinGet manifest validation' }
          winget validate --manifest winget
          if ($LASTEXITCODE -ne 0) { throw 'WinGet manifest validation failed' }
      - name: Set up Go
        if: needs.changes.outputs.manifest_only != 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install LLVM-MinGW
        if: needs.changes.outputs.manifest_only != 'true'
        shell: pwsh
        run: >-
          & .github/scripts/install-llvm-mingw.ps1
          -Version $env:LLVM_MINGW_VERSION
          -Sha256 $env:LLVM_MINGW_SHA256
          -Compiler '${{ matrix.cc }}'
      - name: Build Vertex region models plugin
        if: needs.changes.outputs.manifest_only != 'true'
        shell: bash
        env:
          GOARCH: ${{ matrix.goarch }}
          CC: ${{ matrix.cc }}
        run: |
          set -euo pipefail
          plugin_package_dir="dist/vertex-region-models"
          plugin_dir="$plugin_package_dir/plugins/windows/$GOARCH"
          plugin_output="${PWD}/${plugin_dir}/vertex-region-models-vci.dll"
          plugin_link_output="${PWD}/${plugin_dir}/vertex_region_models.dll"
          mkdir -p "$plugin_dir"
          pushd examples/plugin/vertex-region-models/go >/dev/null
          CGO_ENABLED=1 GOOS=windows GOARCH="$GOARCH" go build \
            -buildmode=c-shared \
            -o "$plugin_link_output" .
          popd >/dev/null
          rm -f "${plugin_link_output%.dll}.h"
          mv "$plugin_link_output" "$plugin_output"
          test -f "$plugin_output"
          test ! -f "${plugin_link_output%.dll}.h"
          powershell -NoProfile -Command "Compress-Archive -Path '${plugin_package_dir}/*' -DestinationPath 'dist/vertex-region-models_ci_windows_${GOARCH}.zip' -Force"
          test -f "dist/vertex-region-models_ci_windows_${GOARCH}.zip"
      - name: Test Windows Vertex plugin runtime
        if: ${{ needs.changes.outputs.manifest_only != 'true' && matrix.goarch == 'amd64' }}
        shell: bash
        run: |
          set -euo pipefail
          plugin_path="${PWD}/dist/vertex-region-models/plugins/windows/amd64/vertex-region-models-vci.dll"
          plugin_path="$(cygpath -w "$plugin_path")"
          CLIPROXY_VERTEX_REGION_MODELS_PLUGIN="$plugin_path" \
            go test ./internal/pluginhost \
              -run '^(TestDynamicLibraryClientSerializesCalls|TestDynamicLibraryClientCall.*|TestWindowsClosedClientKeepsResidentHostState|TestVertexRegionModelsPluginCABI|TestShadow.*|TestRemoveStaleShadow.*)$' \
              -count=1
