name: One-off Vertex Windows core preview

on:
  push:
    branches: [automation/vertex-win-preview-8.1.2-1]
    paths: [.github/workflows/vertex-windows-preview.yml]

permissions: {}

concurrency:
  group: preview-8.1.2-vertex.1
  cancel-in-progress: false

env:
  SOURCE_SHA: 6b2bb45435ce23b5c9d746525ca59a68633cdb63
  RELEASE_TAG: preview-8.1.2-vertex.1

jobs:
  build:
    if: >-
      github.repository == 'hirsaeki/CLIProxyAPI' &&
      github.ref == 'refs/heads/automation/vertex-win-preview-8.1.2-1' &&
      github.event.before == '6b2bb45435ce23b5c9d746525ca59a68633cdb63' && github.event.deleted == false &&
      github.event.forced == false && github.run_attempt == '1'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            arch: amd64
            machine: '34404'
          - runner: windows-11-arm
            arch: arm64
            machine: '43620'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Build and package the native Windows core
        shell: pwsh
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
          EXPECTED_MACHINE: ${{ matrix.machine }}
          GOTOOLCHAIN: local
          CGO_ENABLED: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          if ((git rev-parse HEAD) -ne $env:SOURCE_SHA) { throw "Unexpected source commit" }
          if ((go env GOHOSTARCH) -ne $env:EXPECTED_ARCH) { throw "Unexpected native Go architecture" }
          $env:GOOS = 'windows'
          $env:GOARCH = $env:EXPECTED_ARCH
          go test ./internal/vertexlocations
          go test -run "^TestClearStaleDisabledAvailability$" ./sdk/cliproxy/auth
          go test -run "^TestVertexStatusPatchRestoresStreamSelection$" ./sdk/cliproxy
          New-Item -ItemType Directory -Path stage, dist | Out-Null
          $buildTime = [DateTime]::UtcNow.ToString('yyyy-MM-ddTHH:mm:ssZ')
          $ldflags = "-s -w -X main.Version=$env:RELEASE_TAG -X main.Commit=$env:SOURCE_SHA -X main.BuildDate=$buildTime"
          go build -ldflags $ldflags -o stage/cli-proxy-api.exe ./cmd/server/
          $reader = [IO.BinaryReader]::new([IO.File]::OpenRead((Resolve-Path stage/cli-proxy-api.exe)))
          try {
            $reader.BaseStream.Position = 0x3c
            $reader.BaseStream.Position = $reader.ReadInt32()
            if ($reader.ReadUInt32() -ne 0x4550 -or $reader.ReadUInt16() -ne [int]$env:EXPECTED_MACHINE) {
              throw "Core executable PE architecture mismatch"
            }
          } finally { $reader.Dispose() }
          Copy-Item LICENSE, README.md, README_CN.md, config.example.yaml -Destination stage/
          $asset = "CLIProxyAPI_${env:RELEASE_TAG}_windows_${env:EXPECTED_ARCH}.zip"
          Compress-Archive -Path 'stage/*' -DestinationPath "dist/$asset"
          $hash = (Get-FileHash "dist/$asset" -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Encoding ascii -Path "dist/$asset.sha256" -Value "$hash  $asset"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vertex-windows-core-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: build
    if: >-
      github.repository == 'hirsaeki/CLIProxyAPI' &&
      github.ref == 'refs/heads/automation/vertex-win-preview-8.1.2-1' &&
      github.event.before == '6b2bb45435ce23b5c9d746525ca59a68633cdb63' && github.event.deleted == false &&
      github.event.forced == false && github.run_attempt == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: vertex-windows-core-*
          merge-multiple: true
          path: dist
      - name: Verify, stage and publish the isolated prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == hirsaeki/CLIProxyAPI ]]
          [[ "$RELEASE_TAG" == preview-8.1.2-vertex.1 ]]
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          api="repos/$GITHUB_REPOSITORY"
          # Require both actual PR merges in the pinned source history and fork main.
          gh api "$api/pulls/187" | jq -e --arg sha "$SOURCE_SHA" \
            '.merged == true and .merge_commit_sha == $sha and .base.ref == "main" and .base.repo.full_name == "hirsaeki/CLIProxyAPI"' >/dev/null
          sync_sha="$(gh api "$api/pulls/186" | jq -er \
            'select(.merged == true and .base.ref == "main" and .base.repo.full_name == "hirsaeki/CLIProxyAPI") | .merge_commit_sha')"
          [[ "$sync_sha" =~ ^[0-9a-f]{40}$ ]]
          gh api "$api/compare/$sync_sha...$SOURCE_SHA" | jq -e \
            '.status == "identical" or .status == "ahead"' >/dev/null
          gh api "$api/compare/$SOURCE_SHA...main" | jq -e \
            '.status == "identical" or .status == "ahead"' >/dev/null
          # An independently published stable release can advance during
          # this run. Check only that this unique preview is not Latest.
          verify_not_latest() {
            local latest
            latest="$(gh api "$api/releases/latest" --jq .tag_name)" || return 1
            [[ -n "$latest" && "$latest" != "$RELEASE_TAG" ]]
          }
          verify_not_latest
          amd="CLIProxyAPI_${RELEASE_TAG}_windows_amd64.zip"
          arm="CLIProxyAPI_${RELEASE_TAG}_windows_arm64.zip"
          sums="SHA256SUMS.txt"
          cd dist
          for file in "$amd" "$arm"; do
            [[ -f "$file" && ! -L "$file" && -f "$file.sha256" && ! -L "$file.sha256" ]]
            diff -u <(tr -d '\r' < "$file.sha256") <(sha256sum "$file")
            unzip -tq "$file"
            diff -u <(printf '%s\n' LICENSE README.md README_CN.md cli-proxy-api.exe config.example.yaml) <(unzip -Z -1 "$file" | LC_ALL=C sort)
          done
          sha256sum "$amd" "$arm" > "$sums"

          # Reject any existing release (including a draft) before reserving the
          # exact tag via atomic ref creation. Never overwrite release assets.
          existing="$(gh api --paginate "$api/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"$RELEASE_TAG\") | .id")"
          [[ -z "$existing" ]]
          tag_sha="$(gh api --method POST "$api/git/refs" \
            -f ref="refs/tags/$RELEASE_TAG" -f sha="$SOURCE_SHA" --jq .object.sha)"
          [[ "$tag_sha" == "$SOURCE_SHA" ]]

          notes="$(printf '%s\n\n%s\n\n%s' \
            "Windows x64 / ARM64 core-only preview from $SOURCE_SHA, including the v8.1.2 sync (#186) and the persistent Vertex 503 fix after re-enabling a credential (#187). The repository-local preview WinGet manifest uses package version 8.1.1.0.1 so stable 8.1.2 can replace it normally. No plugin bundle, management.html, or container is published here." \
            'Vertex regional fallback remains opt-in and checks fresh exact-model availability. Default logs show actual regional attempts and explain native handoff or why there was no verified alternative.' \
            "See [configuration and limits](https://github.com/$GITHUB_REPOSITORY/blob/$SOURCE_SHA/docs/vertex-regional-capacity-failover.md). No live Vertex generation was tested.")"
          release_id="$(gh api --method POST "$api/releases" \
            -f tag_name="$RELEASE_TAG" -f target_commitish="$SOURCE_SHA" \
            -F draft=true -F prerelease=true -f make_latest=false \
            -f name="CLIProxyAPI $RELEASE_TAG" -f body="$notes" --jq .id)"
          [[ "$release_id" =~ ^[0-9]+$ ]]
          gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" "$amd" "$arm" "$sums"

          # Compare API-computed digests on the private draft before publication.
          info="$(gh api "$api/releases/$release_id")"
          jq -e --arg tag "$RELEASE_TAG" --arg sha "$SOURCE_SHA" \
            '.tag_name == $tag and .target_commitish == $sha and .draft == true and .prerelease == true and (.assets | length) == 3' <<< "$info" >/dev/null
          for file in "$amd" "$arm" "$sums"; do
            digest="sha256:$(sha256sum "$file" | cut -d' ' -f1)"
            jq -e --arg file "$file" --arg digest "$digest" \
              '[.assets[] | select(.name == $file and .state == "uploaded" and .digest == $digest)] | length == 1' \
              <<< "$info" >/dev/null
          done
          [[ "$(gh api "$api/git/ref/tags/$RELEASE_TAG" --jq .object.sha)" == "$SOURCE_SHA" ]]
          verify_not_latest
          published="$(gh api --method PATCH "$api/releases/$release_id" \
            -F draft=false -F prerelease=true -f make_latest=false)"
          jq -e --arg tag "$RELEASE_TAG" --arg sha "$SOURCE_SHA" \
            '.tag_name == $tag and .target_commitish == $sha and .draft == false and .prerelease == true and (.assets | length) == 3' \
            <<< "$published" >/dev/null
          verify_not_latest
          # Re-download the public files to validate the actual install URLs.
          mkdir verified
          for file in "$amd" "$arm" "$sums"; do
            curl -fsSL --retry 4 --retry-all-errors --max-time 120 \
              "https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/$file" \
              -o "verified/$file"
            cmp -- "$file" "verified/$file"
          done
          (cd verified && sha256sum --check "$sums")
          cat -- "$sums"
          jq -r .html_url <<< "$published" >> "$GITHUB_STEP_SUMMARY"
